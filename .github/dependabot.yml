version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    # These need compileSdk 37; the app builds against 36. Drop each rule
    # when compileSdk moves up.
    ignore:
      - dependency-name: "dev.chrisbanes.haze:*"
        versions: [">=1.7.0"]
      - dependency-name: "io.coil-kt.coil3:*"
        versions: [">=3.6.0"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.09.00"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
