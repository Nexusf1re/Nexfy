# Tagging a version (git tag v0.2.0 && git push origin v0.2.0) builds the
# signed APK and publishes it as a GitHub release with notes from the commits.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Android NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - name: Rust toolchain
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            core/uniffi-bindgen -> target

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXFY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexfy-release.jks"

      - name: Build APK
        env:
          NEXFY_KEYSTORE: ${{ runner.temp }}/nexfy-release.jks
          NEXFY_KEYSTORE_PASSWORD: ${{ secrets.NEXFY_KEYSTORE_PASSWORD }}
          NEXFY_KEY_ALIAS: ${{ secrets.NEXFY_KEY_ALIAS }}
          NEXFY_KEY_PASSWORD: ${{ secrets.NEXFY_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "nexfy-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "nexfy-$VERSION.apk" \
            --title "Nexfy $VERSION" --generate-notes
