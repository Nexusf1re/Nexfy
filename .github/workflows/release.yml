# Tagging a version (git tag v0.2.0 && git push origin v0.2.0) builds the
# signed APK and publishes it as a GitHub release. Its notes come from
# release-notes/<tag>.md when that file exists (what the app shows as "Novidades"),
# else from the commit subjects since the previous tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags, for the notes since the previous version.
          fetch-depth: 0

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXFY_KEYSTORE_BASE64 }}
          NEXFY_KEYSTORE_PASSWORD: ${{ secrets.NEXFY_KEYSTORE_PASSWORD }}
          NEXFY_KEY_ALIAS: ${{ secrets.NEXFY_KEY_ALIAS }}
          NEXFY_KEY_PASSWORD: ${{ secrets.NEXFY_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 NEXFY_KEYSTORE_PASSWORD NEXFY_KEY_ALIAS NEXFY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexfy-release.jks"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Gradle's downloads and wrapper, kept between runs.
          cache: gradle

      # The runner image ships the Android SDK; only the pinned NDK is added.
      - name: Android NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.16248370"

      - name: Rust toolchain
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      # Reads the cache main's CI keeps (crates, the host tools) and saves none:
      # a tag cannot read another tag's cache, so each would be a dead copy.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nexfy
          save-if: false
          workspaces: |
            core -> target
            core/uniffi-bindgen -> target

      - name: Build APK
        env:
          NEXFY_KEYSTORE: ${{ runner.temp }}/nexfy-release.jks
          NEXFY_KEYSTORE_PASSWORD: ${{ secrets.NEXFY_KEYSTORE_PASSWORD }}
          NEXFY_KEY_ALIAS: ${{ secrets.NEXFY_KEY_ALIAS }}
          NEXFY_KEY_PASSWORD: ${{ secrets.NEXFY_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "nexfy-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="release-notes/$GITHUB_REF_NAME.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log --no-merges --format="- %s" ${PREVIOUS:+$PREVIOUS..}"$GITHUB_REF_NAME" \
              | sed -E 's/^- [a-z]+(\([^)]*\))?: /- /' > "$NOTES"
          fi
          # A tag moved and pushed again replaces its release rather than failing.
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" "nexfy-$VERSION.apk" \
            --title "Nexfy $VERSION" --notes-file "$NOTES"
