# Every push to main and every pull request: build the debug APK and run
# the core tests. Needs no secrets, so it also runs for forks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Android NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - name: Rust toolchain
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      # cpal links ALSA on the Linux host for the core tests.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            core/uniffi-bindgen -> target

      - name: Core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nexfy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
